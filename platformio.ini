; Zajednička podešavanja za oba režima (ne moraš ništa menjati duplo)
[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    tzapu/WiFiManager @ ^0.16.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    links2004/WebSockets @ ^2.4.1

; 1. REŽIM ZA USB KABL (kada je NodeMCU priključen na računar)
[env:nodemcu_usb]
upload_protocol = esptool
upload_speed = 460800

; 2. REŽIM ZA BEŽIČNI OTA UPLOAD (kada je NodeMCU na kapiji)
[env:nodemcu_ota]
upload_protocol = espota
upload_port = 192.168.1.40
